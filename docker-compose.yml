version: '3.8'

services:
  nist_compliance_scanner:
    build: 
      context: .
      dockerfile: Dockerfile
    image: nist-compliance-scanner
    container_name: nist_compliance_scanner
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - jaeger
      - prometheus

  redis:
    image: redis:6.2-alpine
    container_name: nist_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.22
    container_name: nist_jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v2.30.3
    container_name: nist_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:8.1.5
    container_name: nist_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  redis_data:
  grafana_data:

networks:
  default:
    name: nist-compliance-network
