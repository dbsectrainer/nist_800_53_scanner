global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Flask compliance dashboard exposes Prometheus metrics at /metrics
  - job_name: "nist_dashboard"
    metrics_path: /metrics
    static_configs:
      - targets: ["nist_compliance_scanner:8000"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14268"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert_rules.yml"
