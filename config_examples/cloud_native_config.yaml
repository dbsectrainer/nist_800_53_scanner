# Cloud-Native NIST 800-53 Scanner Configuration

# Global Cloud-Native Settings
global:
  tenant_id: cloud-native-org
  environment: cloud
  log_level: INFO

# Security Configuration
security:
  authentication:
    method: oidc
    provider: azure_ad
    max_api_key_age: 60 # days
    password_policy:
      min_length: 14
      require_complexity: true

  encryption:
    sensitive_data: true
    key_rotation_interval: 45 # days
    algorithms:
      data_at_rest: AES-256-GCM
      data_in_transit: TLS-1.3

  rate_limiting:
    max_requests: 100
    time_window: 3600 # seconds

# Cloud Provider Configuration
cloud_providers:
  azure:
    enabled: true
    credentials:
      method: managed_identity
      tenant_id: ${AZURE_TENANT_ID}
    subscriptions:
      - primary-subscription-id
      - secondary-subscription-id

  aws:
    enabled: true
    credentials:
      method: ecs_task_role
    regions:
      - us-east-1
      - us-west-2

  gcp:
    enabled: true
    credentials:
      method: workload_identity
    projects:
      - cloud-native-project

# Scanning Options
scan_options:
  distributed_scanning: true
  parallel_scanning: true
  max_concurrent_scans: 5
  scan_timeout: 3600 # seconds

  scan_categories:
    - access_control
    - network_security
    - cloud_configuration

  control_filters:
    severity:
      - high
    tags:
      - cloud_native
      - microservices

# Monitoring and Observability
monitoring:
  enabled: true
  metrics:
    prometheus:
      enabled: true
      endpoint: /metrics

    tracing:
      opentelemetry:
        enabled: true
        collector_endpoint: https://otel-collector.cloud-native.local

  logging:
    cloud_native:
      enabled: true
      provider: azure_log_analytics
      workspace_id: ${LOG_ANALYTICS_WORKSPACE_ID}

# Notification Channels
notifications:
  email:
    enabled: false

  slack:
    enabled: true
    webhook_url: ${SLACK_CLOUD_NATIVE_WEBHOOK}

  cloud_native_alerting:
    enabled: true
    provider: azure_monitor
    action_groups:
      - security_team_alert

# Kubernetes Integration
kubernetes:
  enabled: true
  cluster_scanning:
    namespaces:
      - default
      - kube-system
      - monitoring
    resource_types:
      - deployments
      - pods
      - services
      - networkpolicies

# Advanced Security Policies
security_policies:
  pod_security:
    prevent_privileged_pods: true
    restrict_host_namespace: true
    read_only_root_filesystem: true

  network_policies:
    default_deny: true
    allow_internal_dns: true
