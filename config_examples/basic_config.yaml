# Basic NIST 800-53 Scanner Configuration

# Global Scanner Settings
global:
  tenant_id: default
  environment: cloud
  log_level: INFO

# Security Configuration
security:
  authentication:
    method: api_key
    max_api_key_age: 30 # days
    password_policy:
      min_length: 12
      require_complexity: true

  rate_limiting:
    max_requests: 50
    time_window: 3600 # seconds

# Scanning Options
scan_options:
  scan_categories:
    - access_control
    - audit_logging
    - network_security

  parallel_scanning: true
  max_concurrent_scans: 3

# Logging Configuration
logging:
  local:
    enabled: true
    path: ./logs
    max_size: 10 # MB
    backup_count: 3
