<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Report Details - NIST 800-53 Scanner</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Report Details</h1>
      <div class="report-info">
        <h2>Report ID: {{ report.report_id }}</h2>
        <p>Timestamp: {{ report.timestamp }}</p>

        <h3>Metadata</h3>
        <pre>{{ report.metadata | tojson(indent=2) }}</pre>

        <h3>Scan Results</h3>
        <pre>{{ report.results | tojson(indent=2) }}</pre>
      </div>
      <a href="/" class="btn">Back to Reports</a>
    </div>
    <script src="{{ url_for('static', filename='js/dashboard-utils.js') }}"></script>
  </body>
</html>
