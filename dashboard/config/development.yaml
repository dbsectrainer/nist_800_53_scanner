# Development Environment Configuration for NIST 800-53 Dashboard

# Application Settings
app:
  name: NIST 800-53 Compliance Dashboard
  environment: development
  debug: true
  secret_key: dev_secret_key_change_in_production
  port: 5001

# Authentication Configuration
authentication:
  method: local # Options: local, ldap, saml
  token:
    expiration: 3600 # 1 hour
    algorithm: HS256

  local_users:
    - username: admin
      password: dev_admin_password # MUST be changed
      role: admin
    - username: analyst
      password: dev_analyst_password # MUST be changed
      role: analyst

# Database Configuration
database:
  type: sqlite # Options: sqlite, postgresql, mysql
  path: ./dashboard_dev.db

# Logging Configuration
logging:
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ./logs/dashboard_dev.log

# CORS Configuration
cors:
  enabled: true
  allowed_origins:
    - http://localhost:5001
    - http://127.0.0.1:5001

# Feature Flags
features:
  machine_learning_insights: true
  advanced_visualization: true
  demo_mode: true

# External Services
external_services:
  threat_intelligence:
    enabled: false # Disabled in development

  compliance_sync:
    enabled: false # Disabled in development

# Performance Monitoring
performance:
  profiling: true
  max_concurrent_requests: 10
