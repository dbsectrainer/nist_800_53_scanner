# Predictive Threat Detection Configuration

# Global Settings
global:
  tenant_id: threat_intelligence_analyzer
  environment: hybrid
  log_level: INFO
  deployment_stage: advanced_analytics

# Threat Categories Configuration
threat_categories:
  - network_intrusion
  - service_compromise
  - configuration_risk
  - data_exfiltration
  - insider_threat
  - ransomware
  - advanced_persistent_threat

# Transfer Learning Configuration
transfer_learning:
  feature_extractor_url: "https://tfhub.dev/google/universal-sentence-encoder/4"
  fine_tuning:
    enabled: true
    learning_rate: 0.0001
    freeze_base_layers: true

# Machine Learning Model Configuration
ml_model:
  architecture:
    network_features:
      input_dim: 15
      layers:
        - units: 64
          activation: relu
        - units: 32
          activation: relu
    
    system_features:
      input_dim: 10
      layers:
        - units: 32
          activation: relu
        - units: 16
          activation: relu
    
    text_features:
      input_dim: 512
      layers:
        - units: 64
          activation: relu
        - units: 32
          activation: relu
  
  training:
    optimizer:
      type: adam
      learning_rate: 0.001
    
    hyperparameters:
      epochs: 100
      batch_size: 32
      validation_split: 0.2
    
    regularization:
      l1_rate: 0.0001
      l2_rate: 0.0001
    
    callbacks:
      early_stopping:
        patience: 10
        monitor: val_loss
      
      learning_rate_reduction:
        factor: 0.5
        patience: 5

# Data Sources Configuration
data_sources:
  historical_threat_data:
    type: 
      - database
      - csv
      - threat_intelligence_feed
    
    providers:
      - misp
      - osint_feeds
      - threat_exchange
    
    collection_frequency: daily
  
  real_time_data:
    sources:
      - network_logs
      - system_events
      - security_alerts
      - threat_intelligence_platforms
    
    streaming:
      enabled: true
      buffer_size: 1000
      processing_interval: 60  # seconds

# Feature Extraction Configuration
feature_extraction:
  network_features:
    - open_ports
    - service_count
    - network_complexity
    - traffic_patterns
  
  system_features:
    - system_age
    - patch_level
    - resource_utilization
    - configuration_drift
  
  text_features:
    - threat_description
    - security_event_logs
    - incident_reports

# Threat Detection Parameters
threat_detection:
  prediction_thresholds:
    high_risk: 0.8
    medium_risk: 0.5
    low_risk: 0.2
  
  risk_scoring:
    severity_weights:
      network_intrusion: 3
      data_exfiltration: 3
      insider_threat: 2
      configuration_risk: 1
  
  anomaly_detection:
    enabled: true
    sensitivity: 0.7
    methods:
      - statistical_analysis
      - machine_learning_clustering

# Notification and Reporting
notifications:
  email:
    enabled: true
    recipients:
      - security-team@company.com
      - incident-response@company.com
    severity_thresholds:
      high_risk: always
      medium_risk: daily_digest
      low_risk: weekly_summary
  
  slack:
    enabled: true
    webhook_url: ${SLACK_THREAT_DETECTION_WEBHOOK}
    channels:
      high_risk: "#security-critical"
      medium_risk: "#security-incidents"
  
  pagerduty:
    enabled: true
    service_key: ${PAGERDUTY_THREAT_SERVICE_KEY}
    escalation_policy: threat_detection_emergency

# Performance and Scalability
performance:
  max_concurrent_predictions: 5
  prediction_timeout: 3600  # seconds
  
  distributed_computing:
    enabled: true
    worker_nodes: auto
    load_balancing: adaptive

# Compliance and Auditing
compliance:
  frameworks:
    - nist_800_53
    - hipaa
    - pci_dss
  
  audit_logging:
    enabled: true
    retention_period: 365  # days

# Continuous Improvement
continuous_improvement:
  model_retraining:
    trigger_conditions:
      - performance_degradation
      - new_threat_patterns
      - significant_false_positive_rate
    
    frequency:
      periodic: 30  # days
      adaptive: true
  
  feedback_loop:
    enabled: true
    collection_methods:
      - manual_review
      - automated_analysis
      - security_team_input

# External Threat Intelligence Integration
threat_intelligence:
  providers:
    misp:
      enabled: true
      url: https://misp.company.com
      api_key: ${MISP_API_KEY}
    
    osint:
      enabled: true
      sources:
        - https://osint.example.com/latest_threats
        - https://threat-feed.security.org/indicators
  
  correlation:
    enabled: true
    methods:
      - pattern_matching
      - machine_learning_clustering
      - graph_analysis
