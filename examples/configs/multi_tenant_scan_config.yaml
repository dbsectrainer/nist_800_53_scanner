# Multi-Tenant Compliance Scanning Configuration

# Global Scanning Settings
global:
  tenant_id: multi_tenant_org
  environment: production
  log_level: INFO

# Tenant Configurations
tenants:
  - id: tenant_finance
    name: Financial Services Tenant
    cloud_providers:
      - aws
      - azure
    compliance_frameworks:
      - pci_dss
      - sox
      - nist_800_53
    sensitive_resources:
      - customer_financial_data
      - transaction_logs
      - trading_systems
    scanning_options:
      max_concurrent_scans: 3
      scan_depth: high
      critical_asset_protection: true

  - id: tenant_healthcare
    name: Healthcare Provider Tenant
    cloud_providers:
      - azure
      - gcp
    compliance_frameworks:
      - hipaa
      - hitech
      - gdpr
    sensitive_resources:
      - patient_records
      - medical_imaging
      - telehealth_platform
    scanning_options:
      max_concurrent_scans: 2
      scan_depth: critical
      phi_protection: true

  - id: tenant_research
    name: Research and Education Tenant
    cloud_providers:
      - aws
    compliance_frameworks:
      - ferpa
      - research_data_protection
    sensitive_resources:
      - research_datasets
      - grant_management
      - collaborative_platforms
    scanning_options:
      max_concurrent_scans: 1
      scan_depth: medium
      international_collaboration_review: true

# External System Integrations
external_systems:
  jira:
    enabled: true
    server: https://jira.company.com
    username: ${JIRA_USERNAME}
    password: ${JIRA_PASSWORD}
    project: COMPLIANCE
  
  slack:
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}

# Scanning Options
scan_options:
  distributed_scanning: true
  parallel_scanning: true
  max_total_concurrent_scans: 5
  scan_timeout: 7200  # seconds (2 hours)

  control_filters:
    severity:
      - high
      - critical
    compliance_status:
      - non_compliant
    tags:
      - multi_tenant
      - sensitive_data

# Security Configuration
security:
  authentication:
    method: multi_factor
    providers:
      - type: api_key
      - type: oauth
    max_api_key_age: 45  # days
  
  encryption:
    sensitive_data: true
    key_rotation_interval: 30  # days
    algorithms:
      data_at_rest: AES-256-GCM
      data_in_transit: TLS-1.3

# Monitoring Configuration
monitoring:
  enabled: true
  metrics:
    prometheus:
      enabled: true
      endpoint: /metrics
    
    tracing:
      opentelemetry:
        enabled: true
        collector_endpoint: https://otel-collector.multi-tenant.local

# Logging Configuration
logging:
  compliance_logging:
    enabled: true
    retention_period: 365  # days
    audit_trail: true
    mask_sensitive_data: true

# Notification Channels
notifications:
  email:
    enabled: true
    recipients:
      - compliance-team@company.com
      - security-ops@company.com
  
  pagerduty:
    enabled: true
    service_key: ${PAGERDUTY_SERVICE_KEY}

# Compliance Reporting
reporting:
  formats:
    - pdf
    - html
    - json
  
  distribution:
    internal_share: true
    external_audit: true
  
  retention:
    period: 7  # years
    archive_method: encrypted_storage

# Advanced Compliance Policies
compliance_policies:
  cross_tenant_review:
    enabled: true
    compare_security_controls: true
    identify_best_practices: true
  
  continuous_monitoring:
    enabled: true
    frequency: daily
    alert_threshold: 80  # percentage
