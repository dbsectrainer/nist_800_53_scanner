# Web Application Security Scanning Configuration

# Global Scanning Settings
global:
  tenant_id: web-app-security
  environment: production
  log_level: INFO

# Web Application Targets
targets:
  - target: https://ecommerce.company.com
    scan_types:
      - web_vulnerability
      - authentication_review
      - data_exposure_check
      - payment_system_security
    options:
      check_owasp_top_10: true
      test_authentication_flows: true
      verify_data_protection: true
      payment_card_compliance: true
    sensitive_endpoints:
      - /checkout
      - /account
      - /admin
      - /payment
    compliance_frameworks:
      - pci_dss
      - gdpr
    security_focus:
      - user_data_protection
      - transaction_security
      - session_management

  - target: https://banking.financial-org.com
    scan_types:
      - security_headers
      - ssl_tls_configuration
      - input_validation
      - authentication_mechanism
    options:
      minimum_tls_version: TLS_1_2
      check_csp_headers: true
      verify_xss_protection: true
      multi_factor_authentication_audit: true
    sensitive_paths:
      - /login
      - /transfer
      - /account-details
      - /investment-management
    compliance_requirements:
      - sox
      - glba
      - nist_800_53
    security_focus:
      - financial_data_protection
      - secure_transactions
      - identity_verification

  - target: https://patient.healthcare.org
    scan_types:
      - hipaa_compliance
      - data_privacy
      - secure_communication
      - access_control
    options:
      check_phi_protection: true
      verify_encryption: true
      audit_access_controls: true
      patient_data_isolation: true
    compliance_requirements:
      - hipaa
      - hitech
    sensitive_resources:
      - medical_records
      - appointment_scheduling
      - telehealth_consultation
    security_focus:
      - patient_data_confidentiality
      - secure_communication_channels
      - role_based_access

# Scanning Options
scan_options:
  distributed_scanning: true
  parallel_scanning: true
  max_concurrent_scans: 3
  scan_timeout: 1800  # seconds

  control_filters:
    severity:
      - high
      - critical
    compliance_status:
      - non_compliant
    tags:
      - web_application
      - sensitive_data

# Security Configuration
security:
  authentication:
    method: multi_factor
    providers:
      - type: password
      - type: biometric
      - type: hardware_token
    max_api_key_age: 30  # days
  
  encryption:
    sensitive_data: true
    key_rotation_interval: 30  # days
    algorithms:
      data_at_rest: AES-256-GCM
      data_in_transit: TLS-1.3

# Monitoring Configuration
monitoring:
  enabled: true
  metrics:
    prometheus:
      enabled: true
      endpoint: /metrics
    
    tracing:
      opentelemetry:
        enabled: true
        collector_endpoint: https://otel-collector.webapp.local

# Logging Configuration
logging:
  compliance_logging:
    enabled: true
    retention_period: 365  # days
    audit_trail: true
    mask_sensitive_data: true

# Notification Channels
notifications:
  email:
    enabled: true
    recipients:
      - web-security@company.com
      - incident-response@company.com
  
  slack:
    enabled: true
    webhook_url: ${SLACK_WEBAPP_SECURITY_WEBHOOK}

# Advanced Security Policies
security_policies:
  input_validation:
    prevent_sql_injection: true
    prevent_xss: true
    sanitize_user_input: true
  
  authentication:
    enforce_strong_passwords: true
    implement_account_lockout: true
    require_periodic_password_reset: true

# Compliance Reporting
reporting:
  formats:
    - pdf
    - html
    - json
  
  distribution:
    internal_share: true
    external_audit: true
  
  retention:
    period: 7  # years
    archive_method: encrypted_storage
