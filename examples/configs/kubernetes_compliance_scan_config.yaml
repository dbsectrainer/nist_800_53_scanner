# Kubernetes Cluster Compliance Scanning Configuration

# Global Scanning Settings
global:
  tenant_id: enterprise-kubernetes
  environment: production
  log_level: DEBUG

# Kubernetes Cluster Targets
clusters:
  - cluster_name: production-eks-cluster
    provider: aws
    namespaces:
      - default
      - kube-system
      - application-services
    scan_types:
      - pod_security
      - network_policy
      - rbac_review
    compliance_frameworks:
      - nist_800_53
      - pci_dss
    sensitive_resources:
      - payment_processing
      - customer_data_service

  - cluster_name: staging-gke-cluster
    provider: gcp
    namespaces:
      - default
      - dev
      - monitoring
    scan_types:
      - container_image_scan
      - secrets_management
      - cluster_configuration
    compliance_frameworks:
      - hipaa
      - gdpr
    sensitive_resources:
      - medical_records_service
      - research_data_processing

  - cluster_name: multi-tenant-aks-cluster
    provider: azure
    namespaces:
      - team-alpha
      - team-beta
      - shared-services
    scan_types:
      - tenant_isolation
      - resource_quota
      - network_segmentation
    compliance_frameworks:
      - nist_800_53
      - iso_27001
    sensitive_resources:
      - multi_tenant_platform
      - shared_infrastructure

# Scanning Options
scan_options:
  distributed_scanning: true
  parallel_scanning: true
  max_concurrent_scans: 3
  scan_timeout: 7200  # seconds

  control_filters:
    severity:
      - high
      - critical
    compliance_status:
      - non_compliant
    tags:
      - kubernetes
      - container_security

# Security Configuration
security:
  authentication:
    method: multi_factor
    providers:
      - type: kubernetes_service_account
      - type: client_certificate
    max_api_key_age: 45  # days
  
  encryption:
    sensitive_data: true
    key_rotation_interval: 30  # days
    algorithms:
      data_at_rest: AES-256-GCM
      data_in_transit: TLS-1.3

# Monitoring Configuration
monitoring:
  enabled: true
  metrics:
    prometheus:
      enabled: true
      endpoint: /metrics
    
    tracing:
      opentelemetry:
        enabled: true
        collector_endpoint: https://otel-collector.kubernetes.local

# Logging Configuration
logging:
  compliance_logging:
    enabled: true
    retention_period: 365  # days
    audit_trail: true

# Notification Channels
notifications:
  email:
    enabled: true
    recipients:
      - kubernetes-admin@company.com
      - security-team@company.com
  
  slack:
    enabled: true
    webhook_url: ${SLACK_KUBERNETES_WEBHOOK}

# Advanced Security Policies
security_policies:
  pod_security:
    prevent_privileged_pods: true
    restrict_host_namespace: true
    read_only_root_filesystem: true
  
  network_policies:
    default_deny: true
    allow_internal_dns: true
    encrypted_communication: true

# Compliance Reporting
reporting:
  formats:
    - pdf
    - json
    - markdown
  
  distribution:
    internal_share: true
    external_audit: true
  
  retention:
    period: 7  # years
    archive_method: encrypted_storage
