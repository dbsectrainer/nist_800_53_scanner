# Adaptive Compliance Assessment Configuration

# Global Scanning Settings
global:
  tenant_id: adaptive_compliance_scanner
  environment: hybrid
  log_level: INFO
  deployment_stage: production

# Scan Targets Configuration
scan_targets:
  - name: financial_infrastructure
    type: financial_services
    cloud_providers:
      - aws
      - azure
    compliance_frameworks:
      - pci_dss
      - sox
      - nist_800_53
    sensitive_resources:
      - customer_financial_data
      - transaction_logs
      - trading_systems
    age: 3 # years
    complexity_factors:
      - multi_region_deployment
      - high_transaction_volume

  - name: healthcare_systems
    type: healthcare_network
    cloud_providers:
      - gcp
      - azure
    compliance_frameworks:
      - hipaa
      - hitech
      - gdpr
    sensitive_resources:
      - patient_records
      - medical_imaging
      - telehealth_platform
    age: 2 # years
    complexity_factors:
      - distributed_care_systems
      - international_data_sharing

  - name: research_infrastructure
    type: research_education
    cloud_providers:
      - aws
    compliance_frameworks:
      - ferpa
      - research_data_protection
    sensitive_resources:
      - research_datasets
      - grant_management
      - collaborative_platforms
    age: 1 # years
    complexity_factors:
      - multi_institutional_collaboration
      - cross_border_research

# Machine Learning Model Configuration
ml_model:
  compliance_model:
    type: neural_network
    architecture:
      layers:
        - units: 64
          activation: relu
        - units: 32
          activation: relu
        - units: 1
          activation: sigmoid
    training:
      epochs: 50
      batch_size: 32
      validation_split: 0.2

  context_model:
    type: neural_network
    architecture:
      layers:
        - units: 32
          activation: relu
        - units: 16
          activation: relu
        - units: 5
          activation: softmax
    training:
      epochs: 30
      batch_size: 32
      validation_split: 0.2

# Feature Extraction Configuration
feature_extraction:
  weights:
    cloud_providers: 0.5
    compliance_frameworks: 0.3
    system_age: 0.2
    sensitive_resources: 0.3
    complexity_factors: 0.2

  normalization:
    method: standard_scaler
    parameters:
      with_mean: true
      with_std: true

# Compliance Assessment Parameters
compliance_assessment:
  thresholds:
    compliant: 0.7
    high_risk: 0.4

  risk_levels:
    critical: 0.8
    high: 0.6
    medium: 0.4
    low: 0.2

# Context Adaptation Settings
context_adaptation:
  enabled: true
  strategies:
    - dynamic_risk_scoring
    - contextual_recommendation
    - adaptive_scanning_depth

  risk_contexts:
    - low_risk
    - medium_risk
    - high_risk
    - critical_risk
    - adaptive

# Data Sources
data_sources:
  historical_compliance:
    type: csv
    path: /path/to/historical/compliance/data.csv

  threat_intelligence:
    providers:
      - mitre_att&ck
      - cve_database
      - osint_feeds

# Notification Channels
notifications:
  email:
    enabled: true
    recipients:
      - security-team@company.com
      - compliance-officers@company.com

  slack:
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}

  pagerduty:
    enabled: true
    service_key: ${PAGERDUTY_SERVICE_KEY}

# Advanced Machine Learning Options
advanced_ml:
  transfer_learning:
    enabled: true
    pre_trained_model: nist_800_53_baseline

  anomaly_detection:
    enabled: true
    sensitivity: 0.7

  model_versioning:
    keep_latest: 3
    auto_retrain_interval: 30 # days

# Compliance Frameworks
compliance_frameworks:
  nist_800_53:
    enabled: true
    control_families:
      - AC # Access Control
      - AU # Audit and Accountability
      - SC # System and Communications Protection

  pci_dss:
    enabled: true
    requirements:
      - build_and_maintain_secure_network
      - protect_cardholder_data
      - maintain_vulnerability_management_program

# Performance and Scalability
performance:
  max_concurrent_scans: 3
  scan_timeout: 3600 # seconds

  distributed_computing:
    enabled: true
    worker_nodes: auto
    load_balancing: adaptive

# Reporting Configuration
reporting:
  formats:
    - json
    - pdf
    - html

  distribution:
    internal_share: true
    external_audit: true

  retention:
    period: 7 # years
    archive_method: encrypted_storage

# Continuous Improvement
continuous_improvement:
  feedback_loop:
    enabled: true
    collection_methods:
      - manual_review
      - automated_analysis

  model_retraining:
    trigger_conditions:
      - performance_drop
      - new_threat_patterns
      - regulatory_changes
