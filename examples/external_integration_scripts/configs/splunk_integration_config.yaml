# Splunk Integration Configuration for NIST 800-53 Compliance Scanner

# Splunk Connection Settings
splunk:
  host: splunk.company.com
  port: 8089  # Management port
  hec_port: 8088  # HTTP Event Collector port
  username: ${SPLUNK_USERNAME}
  password: ${SPLUNK_PASSWORD}
  hec_token: ${SPLUNK_HEC_TOKEN}
  index: nist_compliance
  verify_ssl: true

# Scan Targets Configuration
scan_targets:
  - name: production_infrastructure
    type: cloud_infrastructure
    cloud_providers:
      - aws
      - azure
    compliance_frameworks:
      - nist_800_53
      - pci_dss
  
  - name: healthcare_systems
    type: healthcare_network
    cloud_providers:
      - gcp
    compliance_frameworks:
      - hipaa
      - hitech

# Security Configuration
security:
  authentication:
    method: api_key
    max_api_key_age: 45  # days
  
  encryption:
    sensitive_data: true
    key_rotation_interval: 30  # days

# Logging and Monitoring
logging:
  level: INFO
  retention_period: 365  # days

# Compliance Reporting
reporting:
  formats:
    - json
    - csv
  
  distribution:
    splunk_index: true
    internal_share: true

# Advanced Splunk Integration Options
splunk_advanced:
  saved_searches:
    - name: Critical Compliance Violations
      search_query: 'index=nist_compliance severity=high'
      alert_actions:
        - email_notification
        - slack_alert
    
    - name: Compliance Trend Analysis
      search_query: 'index=nist_compliance earliest=-30d@d latest=now'
      report_type: trend_analysis

  dashboards:
    - name: Compliance Overview
      panels:
        - compliance_score
        - violation_trends
        - top_findings

# Notification Channels
notifications:
  email:
    enabled: true
    recipients:
      - security-team@company.com
      - compliance-officers@company.com
  
  slack:
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}

# Compliance Frameworks Mapping
compliance_frameworks:
  nist_800_53:
    enabled: true
    control_families:
      - AC  # Access Control
      - AU  # Audit and Accountability
      - SC  # System and Communications Protection
  
  pci_dss:
    enabled: true
    requirements:
      - build_and_maintain_secure_network
      - protect_cardholder_data
      - maintain_vulnerability_management_program

# Performance and Scalability
performance:
  max_concurrent_scans: 3
  scan_timeout: 3600  # seconds
