# Advanced Security Testing Simulator Configuration

# Global Settings
global:
  tenant_id: security_assessment_simulator
  environment: hybrid
  log_level: INFO
  deployment_stage: comprehensive_testing

# Scan Targets Configuration
scan_targets:
  - name: financial_infrastructure
    type: financial_services
    hostname: finance.company.com
    ip_address: 203.0.113.10
    scanning_priority: high
    assessment_depth: comprehensive
    network_segments:
      - internal_network
      - dmz
    sensitive_resources:
      - transaction_systems
      - customer_financial_data

  - name: healthcare_systems
    type: healthcare_network
    hostname: hospital.healthcare.org
    ip_address: 192.168.1.100
    scanning_priority: critical
    assessment_depth: full
    network_segments:
      - patient_network
      - administrative_network
    sensitive_resources:
      - patient_records
      - medical_imaging_systems

# External Services Configuration
external_services:
  shodan:
    enabled: true
    api_key: ${SHODAN_API_KEY}
    scanning_depth: extensive
  
  nmap:
    enabled: true
    scan_techniques:
      - service_detection
      - version_scanning
      - script_scanning
    performance_mode: aggressive

# Vulnerability Assessment Configuration
vulnerability_assessment:
  severity_levels:
    high:
      weight: 3
      auto_remediation: true
    medium:
      weight: 2
      auto_remediation: false
    low:
      weight: 1
      auto_remediation: false
  
  scanning_strategies:
    - port_scanning
    - service_vulnerability_check
    - configuration_review
    - network_exposure_analysis

# Penetration Testing Simulation
penetration_testing:
  enabled: true
  simulation_techniques:
    - exploit_chaining
    - lateral_movement_simulation
    - privilege_escalation_test
  
  attack_vector_generation:
    enabled: true
    complexity: advanced
    context_awareness: true

# Security Posture Assessment
security_posture:
  scoring_model:
    base_score_weight: 0.6
    vulnerability_weight: 0.3
    exposure_weight: 0.1
  
  risk_categories:
    excellent:
      score_range: [0, 5]
      action: minimal_monitoring
    good:
      score_range: [6, 10]
      action: standard_monitoring
    moderate:
      score_range: [11, 15]
      action: enhanced_monitoring
    poor:
      score_range: [16, 20]
      action: immediate_investigation
    critical:
      score_range: [21, 100]
      action: emergency_response

# Reporting Configuration
reporting:
  formats:
    - json
    - pdf
    - html
    - dashboard_integration
  
  distribution:
    internal_share: true
    security_team_notification: true
    compliance_platform_sync: true
  
  retention:
    period: 7  # years
    archive_method: encrypted_storage

# Notification Channels
notifications:
  email:
    enabled: true
    recipients:
      - security-team@company.com
      - incident-response@company.com
    severity_thresholds:
      critical: always
      high: always
      medium: daily_digest
      low: weekly_summary
  
  slack:
    enabled: true
    webhook_url: ${SLACK_SECURITY_WEBHOOK}
    channels:
      critical: "#security-critical"
      high: "#security-incidents"
      medium: "#security-monitoring"
  
  pagerduty:
    enabled: true
    service_key: ${PAGERDUTY_SERVICE_KEY}
    escalation_policy: security_emergency

# Advanced Machine Learning Options
ml_analysis:
  vulnerability_prediction:
    enabled: true
    model_type: neural_network
    feature_extraction:
      - port_characteristics
      - service_metadata
      - network_exposure
    training:
      frequency: 30  # days
  
  attack_pattern_recognition:
    enabled: true
    techniques:
      - anomaly_detection
      - behavior_analysis
      - threat_clustering

# Performance and Scalability
performance:
  max_concurrent_scans: 5
  scan_timeout: 7200  # seconds
  
  distributed_computing:
    enabled: true
    worker_nodes: auto
    load_balancing: adaptive

# Compliance Frameworks
compliance_frameworks:
  nist_800_53:
    enabled: true
    control_families:
      - AC  # Access Control
      - AU  # Audit and Accountability
      - SC  # System and Communications Protection
  
  pci_dss:
    enabled: true
    requirements:
      - build_and_maintain_secure_network
      - protect_cardholder_data
      - maintain_vulnerability_management_program

# Continuous Improvement
continuous_improvement:
  feedback_loop:
    enabled: true
    collection_methods:
      - manual_review
      - automated_analysis
      - security_team_input
  
  assessment_refinement:
    trigger_conditions:
      - new_vulnerability_patterns
      - emerging_threat_intelligence
      - performance_anomalies
      - regulatory_changes
