[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nist-800-53-compliance-scanner"
version = "1.0.0"
description = "A comprehensive NIST 800-53 security compliance scanning platform for 2025"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Enterprise Security Team", email = "security@example.com"}
]
maintainers = [
    {name = "Enterprise Security Team", email = "security@example.com"}
]
keywords = ["nist", "800-53", "security", "compliance", "scanner", "cloud-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    # Core Cloud Providers (latest stable versions)
    "boto3>=1.35.80",
    "azure-identity>=1.19.0",
    "azure-mgmt-security>=7.0.0",
    "google-cloud-iam>=2.17.0",
    "paramiko>=3.5.0",

    # Machine Learning & Data Processing
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.3",

    # Modern Web Framework
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",

    # Database & ORM
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",

    # Caching & Task Queue
    "redis>=5.2.1",
    "celery>=5.4.0",
    "flower>=2.0.1",

    # Cloud Native & Microservices
    "kubernetes>=31.0.0",
    "docker>=7.1.0",
    "grpcio>=1.68.1",
    "protobuf>=5.29.2",

    # Authentication & Security
    "authlib>=1.3.2",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.1",
    "argon2-cffi>=23.1.0",

    # Monitoring & Observability
    "prometheus-client>=0.25.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",

    # Async & HTTP
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "anyio>=4.7.0",

    # Serverless & Cloud Functions
    "google-cloud-functions>=1.17.0",
    "aws-lambda-powertools>=3.3.0",

    # Message Queues
    "aiokafka>=0.12.0",

    # Configuration & Utilities
    "pyyaml>=6.0.2",
    "click>=8.1.8",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "pytest-mock>=3.14.0",
    "coverage[toml]>=7.6.9",
    "hypothesis>=6.122.3",

    # Code Quality & Linting (Modern 2025 tools)
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pyright>=1.1.390",

    # Type Stubs
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.32.0.20241016",
    "types-pyyaml>=6.0.12.20240917",
    "boto3-stubs[essential]>=1.35.80",

    # Security Scanning
    "bandit[toml]>=1.8.0",
    "safety>=3.2.11",
    "semgrep>=1.96.0",

    # Documentation
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-autodoc-typehints>=2.5.0",

    # Debugging
    "ipdb>=0.13.13",
    "debugpy>=1.8.10",

    # Performance Profiling
    "py-spy>=0.4.0",
    "memray>=1.15.0",
    "scalene>=1.5.49",

    # Mocking and Testing Utilities
    "responses>=0.25.3",
    "faker>=33.1.0",
    "freezegun>=1.5.1",

    # Development Tools
    "pre-commit>=4.0.1",
    "tox>=4.23.2",
    "nox>=2024.10.9",
]

cloud = [
    "kubernetes>=31.0.0",
    "docker>=7.1.0",
    "google-cloud-functions>=1.17.0",
    "aws-lambda-powertools>=3.3.0",
]

all = [
    "nist-800-53-compliance-scanner[dev,cloud]",
]

[project.urls]
Homepage = "https://github.com/your-org/nist-800-53-scanner"
Documentation = "https://nist-800-53-scanner.readthedocs.io"
Repository = "https://github.com/your-org/nist-800-53-scanner"
"Bug Reports" = "https://github.com/your-org/nist-800-53-scanner/issues"
Changelog = "https://github.com/your-org/nist-800-53-scanner/blob/main/CHANGELOG.md"

[project.scripts]
nist-scanner = "scan:main"
nist-auth = "manage_auth:main"

[tool.setuptools]
packages = ["modules"]

[tool.setuptools.package-data]
modules = ["py.typed"]

# Ruff Configuration (Modern Python linter/formatter - 2025 standard)
[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (Any)
    "S105",    # Possible hardcoded password
    "S106",    # Possible hardcoded password
    "TRY003",  # Avoid specifying long messages outside exception class
    "PLR0913", # Too many arguments
    "COM812",  # May conflict with formatter
    "ISC001",  # May conflict with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "ARG",     # Unused arguments
    "PLR2004", # Magic values
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy Configuration (Type Checking)
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "paramiko.*",
    "kubernetes.*",
]
ignore_missing_imports = true

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=modules",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-ra",
    "--maxfail=5",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as asyncio tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage Configuration
[tool.coverage.run]
source = ["modules"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit Security Scanning Configuration
[tool.bandit]
targets = ["modules"]
exclude_dirs = ["/tests"]
skips = ["B101", "B601"]
severity = "medium"

# Black Configuration (Backup formatter)
[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
