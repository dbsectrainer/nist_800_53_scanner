name: NIST 800-53 Scanner CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: 3.9
  POETRY_VERSION: 1.1.12

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Full git history for signing verification

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Run Bandit Security Scanner
      run: poetry run bandit -r modules

    - name: Run Safety Dependency Check
      run: poetry run safety check

  code-signing:
    needs: security-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Import GPG key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        gpg --list-secret-keys

    - name: Sign code
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        find . -type f \( -name "*.py" -o -name "*.yml" \) -not -path "*/\.*" -print0 | 
        while IFS= read -r -d '' file; do
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -u scanner@example.com --detach-sign "$file"
        done

    - name: Verify signatures
      run: |
        find . -type f -name "*.sig" -print0 | 
        while IFS= read -r -d '' sig_file; do
          original_file="${sig_file%.sig}"
          gpg --verify "$sig_file" "$original_file"
        done

  unit-tests:
    needs: code-signing
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.8, 3.9, '3.10']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Run unit tests
      run: poetry run pytest tests/

  distributed-scan-test:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Test Distributed Scanning Configuration
      run: |
        poetry run python -m pytest tests/distributed_scan_test.py

  deploy:
    needs: [distributed-scan-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        # Add deployment script here
        echo "Deploying to production environment"
